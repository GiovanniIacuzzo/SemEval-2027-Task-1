      - huggingface_hub>=0.23
      - pyyaml>=6.0
      - numpy>=1.24.0,<2.0.0
      - tqdm>=4.66.0
      - matplotlib>=3.8.0      
      - gensim>=4.3.2
      - pyserini==1.3.0
      - openai==1.109.1
