general:
  seed: 42
  device: "auto"                 # auto | cuda | mps | cpu
  mixed_precision: true            # BF16 se supportato dalla GPU, altrimenti FP16
  run_tag: "qwen3_reasoning_hybrid_v1"
  logging_level: "INFO"

paths:
  data_mode: "full"               # full | sample
  full_data_dir: "data/reteco_data/track2_recor"
  sample_data_dir: "data/sample/track2_recor"

  # Separati dal precedente BGE per non sovrascrivere i vecchi checkpoint.
  checkpoint_dir: "checkpoints/subtrack_2a/qwen3_embedding_0.6b_reasoning"
  output_dir: "outputs/subtrack_2a/qwen3_embedding_0.6b_reasoning"
  log_dir: "outputs/subtrack_2a/logs"

  embedding_cache_dir: "data/cache/document_embeddings"
  hard_negatives_cache_dir: "data/cache/hard_negatives"
  query_rewrites_cache_dir: "data/cache/query_rewrites/subtrack_2a"

domains:
  # La submission ufficiale deve coprire tutti gli 11 domini.
  # Per uno smoke test si può impostare, ad esempio, ["drones"].
  active_domains: "all"
  domain_balanced_training: true

data:
  query_strategy: "history"
  max_query_length: 512
  max_doc_length: 384
  num_workers: 0
  pin_memory: true

  negatives_per_positive: 2
  hard_negative_pool_size: 40
  negative_sampling_strategy: "bm25_hard"

  # Split interno per conversazione, ricavato esclusivamente da benchmark_train.
  val_ratio: 0.15

  # contextual | reasoned | alternate. Alternate cambia query per epoca,
  # senza duplicare il topic nel medesimo dataset.
  query_mode: "alternate"
  require_reasoned_queries: true

query_rewriting:
  enabled: true
  model_name_or_path: "Qwen/Qwen3-4B-Instruct-2507"
  load_in_4bit: true
  torch_dtype: "float16"
  device_map: "auto"
  trust_remote_code: false
  max_new_tokens: 64
  max_input_tokens: 4096
  max_history_tokens: 3000
  # Salva le riscritture ogni N query completate per poter riprendere dopo stop.
  checkpoint_every: 8
  overwrite_cache: false
  # Cambiare il tag quando si cambia prompt o impostazione del generatore.
  cache_tag: "qwen3_4b_instruct_2507_rewrite_v1"

bi_encoder:
  model_name_or_path: "Qwen/Qwen3-Embedding-0.6B"
  pooling_strategy: "last_token"
  normalize_embeddings: true
  temperature: 0.05
  gradient_checkpointing: true

  query_instruction:
    enabled: true
    text: |-
      Instruct: Given a conversational information-seeking query, retrieve relevant documents from the provided corpus that satisfy the user's information need.
      Query:

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "auto"
  bias: "none"

training:
  epochs: 2
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  negative_chunk_size: 8
  monitor_metric: "val_ndcg@10_reasoned"
  early_stopping_patience: 1
  log_every_n_steps: 20
  save_prevalidation_checkpoint: true # checkpoint adapter prima della validazione costosa

evaluation:
  eval_batch_size: 16
  retrieval_depth: 1000
  cutoff_k: 10

  # Confronto dense-only su identici topic/corpus/qrels.
  # reasoned è la variante primaria per la selezione del checkpoint;
  # contextual resta disponibile come controllo comparativo.
  compare_query_modes: true
  compare_sparse_hybrid: true       # valuta anche BM25 e fusioni RRF
  selection_query_mode: "reasoned"  # legacy compatibility: reasoned | contextual
  selection_system: "dense_reasoned"  # sistema che determina il best checkpoint
  document_eval_batch_size: 32      # batch separato per encoding del corpus; si riduce automaticamente su CUDA OOM
  rrf_k: 60

sparse:
  k1: 0.9
  b: 0.4
  