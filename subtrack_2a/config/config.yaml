paths:
  data_mode: "full"   # oppure "sample"
  full_data_dir: "data/reteco_data/track2_recor"
  sample_data_dir: "data/sample/track2_recor"
  checkpoint_dir: "checkpoints/subtrack_2a/bi_encoder"
  output_dir: "outputs/subtrack_2a"
  log_dir: "outputs/subtrack_2a/logs"
  embedding_cache_dir: "data/cache/document_embeddings"
  hard_negatives_cache_dir: "data/cache/hard_negatives"

domains:
  active_domains:
    - drones
  domain_balanced_training: true

data:
  query_strategy: "history"
  max_query_length: 256
  max_doc_length: 256
  num_workers: 0
  pin_memory: false

  negatives_per_positive: 2
  hard_negative_pool_size: 20
  negative_sampling_strategy: "bm25_hard"

  val_ratio: 0.15

bi_encoder:
  model_name_or_path: "BAAI/bge-base-en-v1.5"

  pooling_strategy: "cls"
  normalize_embeddings: true
  temperature: 0.05

  gradient_checkpointing: false

  query_instruction:
    enabled: true
    text: "Represent this sentence for searching relevant passages: "

lora:
  enabled: true
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: "auto"
  bias: "none"

training:
  epochs: 1
  batch_size: 4
  gradient_accumulation_steps: 1

  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1

  max_grad_norm: 1.0

  negative_chunk_size: 8

  monitor_metric: "val_ndcg@10"
  early_stopping_patience: 1

  log_every_n_steps: 10

evaluation:
  eval_batch_size: 16
  retrieval_depth: 1000
  cutoff_k: 10